name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - feature/devsecops-pipeline
  pull_request:
    branches:
      - main

jobs:
  source-check:
    name: Check Juice Shop source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Verify Juice Shop source
        run: |
          test -f juice-shop/package.json
          echo "Juice Shop source found"

      - name: Show source version
        run: |
          echo "Expected Juice Shop commit:"
          echo "c9f99228d9d56afb5f5ca7925376292f7fa44b13"
  gitleaks:
    name: Scan secrets with Gitleaks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Scan repository with Trivy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
